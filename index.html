<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f3a77f">
<title>我们的旅行 ✈️</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#fff9f5;
  color:#4d4140;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif
}
.app{
  max-width:900px;
  margin:auto;
  padding-bottom:90px
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.header{padding:24px 16px 15px}
.logo{font-size:27px;font-weight:800}
.subtitle{color:#968783;font-size:13px;margin-top:5px}

.home,.trip-head,.content{padding:0 16px}

.home-title,.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 13px
}

.title{font-size:20px;font-weight:800}

.btn{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#efa37c;
  color:#fff;
  font-weight:700
}

.btn.light{
  background:#fff2e9;
  color:#c9744f;
  border:1px solid #f1cdbb
}

.btn.danger{
  background:#fff1f1;
  color:#d76c6c
}

.trip-card,.card,.total{
  background:#fff;
  border:1px solid #f0ded5;
  border-radius:18px;
  box-shadow:0 7px 22px rgba(120,80,60,.06)
}

.trip-card{
  padding:19px;
  margin-bottom:12px
}

.trip-name{
  font-size:20px;
  font-weight:800
}

.muted{
  color:#968783;
  font-size:13px
}

.members{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px
}

.member{
  background:#fff7f2;
  border:1px solid #efd9ce;
  border-radius:99px;
  padding:5px 9px;
  font-size:12px
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px
}

.tabs{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  gap:7px;
  overflow:auto;
  padding:7px 16px 12px;
  background:rgba(255,249,245,.96);
  backdrop-filter:blur(8px)
}

.tab{
  white-space:nowrap;
  border:1px solid #efdcd3;
  background:#fff;
  color:#8c7d79;
  padding:10px 13px;
  border-radius:13px
}

.tab.active{
  background:#efa37c;
  color:#fff;
  border-color:#efa37c
}

.subtabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:0 0 12px
}

.subtab{
  border:1px solid #ead9d1;
  background:#fff;
  color:#8c7d79;
  padding:8px 13px;
  border-radius:99px
}

.subtab.active{
  background:#fff0e7;
  color:#c9744f;
  border-color:#efa37c
}

.card{
  padding:15px;
  margin:9px 0
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.card-title{
  font-weight:800;
  font-size:16px
}

.time{
  color:#df7c51;
  font-weight:800;
  white-space:nowrap
}

.info{
  color:#8c7d79;
  font-size:13px;
  line-height:1.75;
  margin-top:7px
}

.empty{
  padding:38px 15px;
  text-align:center;
  color:#978984;
  background:#fff;
  border:1px dashed #ead7ce;
  border-radius:18px
}

.total{
  padding:17px;
  margin:10px 0 13px;
  background:linear-gradient(135deg,#fff,#fff1e8)
}

.money{
  font-size:24px;
  font-weight:800;
  color:#df7c51;
  margin-top:5px
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(50,35,30,.38);
  padding:15px;
  align-items:flex-end;
  justify-content:center
}

.modal-bg.show{display:flex}

.modal{
  width:min(650px,100%);
  max-height:93vh;
  overflow:auto;
  background:#fff;
  border-radius:23px;
  padding:20px
}

.modal h2{
  margin:0 0 14px;
  font-size:21px
}

label{
  display:block;
  margin:11px 0 6px;
  color:#8d7e79;
  font-size:13px
}

input,textarea,select{
  width:100%;
  padding:11px;
  border:1px solid #ead9d1;
  border-radius:11px;
  background:#fffaf7;
  color:#4d4140;
  outline:none
}

textarea{
  min-height:75px;
  resize:vertical
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:17px
}

.search{margin-bottom:10px}

.hint{
  font-size:12px;
  color:#978984;
  margin:4px 2px 12px
}

@media(max-width:600px){
  .row{grid-template-columns:1fr}
  .trip-name{font-size:19px}
  .section-head{align-items:center}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">✈️ 我们的旅行</div>
  <div class="subtitle">
    Lynn · Vincent · Esther · Tong
  </div>
</header>

<div id="app"></div>

</div>

<div class="modal-bg" id="modalBg">

  <div class="modal">

    <h2 id="modalTitle">添加</h2>

    <div id="form"></div>

    <div class="modal-actions">

      <button
        class="btn light"
        onclick="closeModal()">
        取消
      </button>

      <button
        class="btn"
        onclick="saveForm()">
        保存
      </button>

    </div>

  </div>

</div>

<script>

const MEMBERS=[
  'Lynn',
  'Vincent',
  'Esther',
  'Tong'
];

const DEFAULT=[
{
  id:1,
  name:'🇭🇰 香港 → 广州 → 成都 → 三江',
  startDate:'2026-11-06',
  endDate:'2026-11-15',
  members:[...MEMBERS],

  itinerary:[

    {
      id:101,
      date:'2026-11-06',
      time:'10:00',
      endTime:'',
      endDate:'',
      icon:'✈️',
      name:'新加坡 → 香港',
      place:'香港机场',
      member:'Lynn',
      note:'抵达后前往酒店',
      link:'',
      map:''
    },

    {
      id:102,
      date:'2026-11-06',
      time:'16:00',
      endTime:'',
      endDate:'',
      icon:'🏨',
      name:'酒店 Check-in',
      place:'九龙',
      member:'Vincent',
      note:'',
      link:'',
      map:''
    },

    {
      id:103,
      date:'2026-11-07',
      time:'19:00',
      endTime:'',
      endDate:'',
      icon:'🍜',
      name:'晚餐',
      place:'尖沙咀',
      member:'Esther',
      note:'',
      link:'',
      map:''
    },

    {
      id:104,
      date:'2026-11-08',
      time:'12:30',
      endTime:'13:30',
      endDate:'',
      icon:'🚄',
      name:'香港 → 广州',
      place:'香港西九龙 → 广州南',
      member:'Tong',
      note:'高铁',
      link:'',
      map:''
    }

  ],

  hotel:[],
  transport:[],
  sight:[],
  shopping:[],
  food:[],
  expenses:[]
}
];

let trips=
  JSON.parse(
    localStorage.getItem('travelTrips')
  ) || DEFAULT;

let currentTripId=null;

let currentTab='itinerary';

let subTab='hotel';

let editType=null;

let editId=null;

let expenseItineraryId=null;


/* =========================
   基本功能
========================= */

function id(){

  return Date.now()+
    Math.random().toString(16).slice(2);

}

function save(){

  localStorage.setItem(
    'travelTrips',
    JSON.stringify(trips)
  );

}

function esc(v=''){

  return String(v).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

}

function trip(){

  return trips.find(
    x=>String(x.id)===String(currentTripId)
  );

}


/* =========================
   旧资料整理
========================= */

function normalize(){

  trips.forEach(t=>{

    t.itinerary=t.itinerary||[];

    t.hotel=t.hotel||[];

    t.transport=t.transport||[];

    t.places=t.places||[];

    t.expense=
      t.expense ||
      t.expenses ||
      [];

    t.expenses=t.expense;

    t.members=
      t.members ||
      [...MEMBERS];

    t.sight=
      t.sight ||
      t.places.filter(
        x=>x.category==='scenic'
      );

    t.food=
      t.food ||
      t.places.filter(
        x=>x.category!=='scenic'
      );

    t.shopping=
      t.shopping ||
      [];

    t.places=[
      ...t.food,
      ...t.sight,
      ...t.shopping
    ].filter(
      (x,i,a)=>
        a.findIndex(
          y=>String(y.id)===String(x.id)
        )===i
    );

  });

  save();

}

normalize();


/* =========================
   Render
========================= */

function render(){

  currentTripId===null
    ? renderHome()
    : renderTrip();

}


/* =========================
   Trip 首页
========================= */

function renderHome(){

  document.getElementById('app').innerHTML=`

    <main class="home">

      <div class="home-title">

        <div class="title">
          🧳 我的 Trips
        </div>

        <button
          class="btn"
          onclick="openTripForm()">
          ＋ 新增 Trip
        </button>

      </div>

      ${
        trips.length

        ?

        trips.map(t=>`

          <div class="trip-card">

            <div onclick="openTrip(${t.id})">

              <div class="trip-name">
                ${esc(t.name)}
              </div>

              <div
                class="muted"
                style="margin-top:6px">

                ${esc(t.startDate||'')}
                —
                ${esc(t.endDate||'')}

              </div>

              <div class="members">

                ${(t.members||[])
                  .map(m=>`
                    <span class="member">
                      ${esc(m)}
                    </span>
                  `)
                  .join('')}

              </div>

            </div>

            <div class="actions">

              <button
                class="btn light"
                onclick="openTripForm(${t.id})">
                ✏️ 编辑 Trip
              </button>

              <button
                class="btn danger"
                onclick="deleteTrip(${t.id})">
                🗑️ 删除
              </button>

            </div>

          </div>

        `).join('')

        :

        `

          <div class="empty">

            还没有 Trip

            <br><br>

            按「＋ 新增 Trip」开始 ✨

          </div>

        `
      }

    </main>

  `;

}


/* =========================
   打开 Trip
========================= */

function openTrip(i){

  currentTripId=i;

  currentTab='itinerary';

  render();

}


/* =========================
   Trip 页面
========================= */

function renderTrip(){

  let t=trip();

  if(!t){

    currentTripId=null;

    return renderHome();

  }

  document.getElementById('app').innerHTML=`

    <div class="trip-head">

      <button
        class="btn light"
        onclick="currentTripId=null;render()">
        ← Trips
      </button>

      <div
        class="title"
        style="margin-top:12px">

        ${esc(t.name)}

      </div>

      <div
        class="muted"
        style="margin-top:5px">

        ${esc(t.startDate)}
        —
        ${esc(t.endDate)}

      </div>

    </div>


    <div class="tabs">

      ${
        [
          ['itinerary','🗓️ 行程'],
          ['hotelTransport','🏨 酒店 & 交通'],
          ['sightShopping','📍 景点 & 购物'],
          ['food','🍜 美食'],
          ['expense','💰 费用']
        ]

        .map(x=>`

          <button
            class="tab
            ${currentTab===x[0]?'active':''}"
            onclick="
              currentTab='${x[0]}';
              render()
            ">

            ${x[1]}

          </button>

        `)
        .join('')
      }

    </div>


    <div class="content">

      ${pageHtml(t)}

    </div>

  `;

}


/* =========================
   页面分类
========================= */

function pageHtml(t){

  if(currentTab==='itinerary')
    return itineraryHtml(t);

  if(currentTab==='hotelTransport')
    return subPage(
      t,
      ['hotel','transport'],
      ['🏨 酒店','🚄 交通']
    );

  if(currentTab==='sightShopping')
    return subPage(
      t,
      ['sight','shopping'],
      ['📍 景点','🛍️ 购物']
    );

  if(currentTab==='food')
    return listPage(
      t,
      'food',
      '🍜 美食'
    );

  return expenseHtml(t);

}


/* =========================
   子分类
========================= */

function subPage(t,types,labels){

  let type=subTab;

  if(!types.includes(type))
    type=types[0];

  subTab=type;

  return `

    <div class="subtabs">

      ${
        types.map((x,i)=>`

          <button
            class="subtab
            ${type===x?'active':''}"
            onclick="
              subTab='${x}';
              render()
            ">

            ${labels[i]}

          </button>

        `).join('')
      }

    </div>

    ${listPage(
      t,
      type,
      labels[types.indexOf(type)]
    )}

  `;

}


/* =========================
   列表
========================= */

function listPage(t,type,title){

  let arr=t[type]||[];

  return `

    <div class="section-head">

      <div class="title">
        ${title}
      </div>

      <button
        class="btn"
        onclick="openItemForm('${type}')">
        ＋ 添加
      </button>

    </div>

    ${
      arr.length

      ?

      arr
        .map(x=>itemCard(t,type,x))
        .join('')

      :

      `

        <div class="empty">

          还没有
          ${title.replace(/^\S+ /,'')}
          资料

          <br><br>

          按「＋ 添加」开始 ✨

        </div>

      `
    }

  `;

}


/* =========================
   卡片
========================= */

function itemCard(t,type,x){

  let date=
    x.date ||
    x.startDate ||
    '';

  let time=
    x.time ||
    x.startTime ||
    '';

  return `

    <div class="card">

      <div class="card-top">

        <div class="card-title">

          ${esc(
            x.name ||
            x.title ||
            '未命名'
          )}

        </div>

        ${
          time

          ?

          `<div class="time">

            ⏰ ${esc(time)}

            ${x.endTime
              ? ' → '+esc(x.endTime)
              : ''}

          </div>`

          :

          ''
        }

      </div>


      <div class="info">

        ${
          date
          ?
          '📅 '+
          esc(date)+
          (
            x.endDate
            ? ' → '+esc(x.endDate)
            : ''
          )+
          '<br>'
          :
          ''
        }

        ${
          x.place
          ?
          '📍 '+esc(x.place)+'<br>'
          :
          ''
        }

        ${
          x.member
          ?
          '👤 '+esc(x.member)+'<br>'
          :
          ''
        }

        ${
          x.note
          ?
          '📝 '+esc(x.note)
          :
          ''
        }

      </div>


      <div class="actions">

        <button
          class="btn light"
          onclick="
            openItemForm(
              '${type}',
              '${x.id}'
            )
          ">

          ✏️ 编辑

        </button>


        ${
          type!=='itinerary'

          ?

          `<button
            class="btn light"
            onclick="
              addToItinerary(
                '${type}',
                '${x.id}'
              )
            ">

            ＋ 加进行程

          </button>`

          :

          ''
        }


        <button
          class="btn danger"
          onclick="
            deleteItem(
              '${type}',
              '${x.id}'
            )
          ">

          删除

        </button>

      </div>

    </div>

  `;

}


/* =========================
   行程
========================= */

function itineraryHtml(t){

  let arr=[
    ...t.itinerary
  ].sort(
    (a,b)=>
      (a.date+a.time)
      .localeCompare(
        b.date+b.time
      )
  );

  return `

    <div class="section-head">

      <div class="title">
        🗓️ 每日行程
      </div>

      <button
        class="btn"
        onclick="openItemForm('itinerary')">

        ＋ 添加

      </button>

    </div>


    ${
      arr.length

      ?

      arr
        .map(x=>itemCard(
          t,
          'itinerary',
          x
        ))
        .join('')

      :

      `

        <div class="empty">

          还没有行程

          <br><br>

          按「＋ 添加」开始 ✨

        </div>

      `
    }

  `;

}


/* =========================
   费用
========================= */

function expenseHtml(t){

  let arr=t.expenses||[];

  let total=
    arr.reduce(
      (s,x)=>
        s+Number(x.amount||0),
      0
    );

  return `

    <div class="total">

      <div class="muted">
        总费用
      </div>

      <div class="money">
        ¥ ${total.toFixed(2)}
      </div>

    </div>


    <div class="section-head">

      <div class="title">
        💰 费用
      </div>

      <button
        class="btn"
        onclick="openItemForm('expense')">

        ＋ 添加费用

      </button>

    </div>


    ${
      arr.length

      ?

      arr.map(x=>`

        <div class="card">

          <div class="card-top">

            <div class="card-title">
              ${esc(x.name)}
            </div>

            <div
              class="money"
              style="font-size:18px">

              ¥ ${Number(
                x.amount||0
              ).toFixed(2)}

            </div>

          </div>


          <div class="info">

            ${
              x.date
              ?
              '📅 '+esc(x.date)+'<br>'
              :
              ''
            }

            ${
              x.payer
              ?
              '👤 '+esc(x.payer)+'<br>'
              :
              ''
            }

            ${
              x.note
              ?
              '📝 '+esc(x.note)
              :
              ''
            }

          </div>


          <div class="actions">

            <button
              class="btn light"
              onclick="
                openItemForm(
                  'expense',
                  '${x.id}'
                )
              ">

              ✏️ 编辑

            </button>

            <button
              class="btn danger"
              onclick="
                deleteItem(
                  'expense',
                  '${x.id}'
                )
              ">

              删除

            </button>

          </div>

        </div>

      `).join('')

      :

      `

        <div class="empty">
          还没有费用
        </div>

      `
    }

  `;

}


/* =========================
   Trip 表单
========================= */

function openTripForm(edit){

  editType='trip';

  editId=edit||null;

  let t=
    edit
    ? trips.find(
        x=>x.id===edit
      )
    : {};

  document.getElementById(
    'modalTitle'
  ).textContent=
    edit
    ? '编辑 Trip'
    : '新增 Trip';

  document.getElementById(
    'form'
  ).innerHTML=`

    <label>Trip 名称</label>

    <input
      id="fName"
      value="${esc(t.name||'')}"
      placeholder="例如：🇭🇰 香港 → 广州 → 成都 → 三江">


    <div class="row">

      <div>

        <label>开始日期</label>

        <input
          id="fStart"
          type="date"
          value="${t.startDate||''}">

      </div>


      <div>

        <label>结束日期</label>

        <input
          id="fEnd"
          type="date"
          value="${t.endDate||''}">

      </div>

    </div>


    <label>成员</label>

    <div class="members">

      ${
        MEMBERS.map(m=>`

          <label class="member">

            <input
              type="checkbox"
              class="mcheck"
              value="${m}"
              ${
                (t.members||[])
                .includes(m)
                ? 'checked'
                : ''
              }>

            ${m}

          </label>

        `).join('')
      }

    </div>

  `;

  showModal();

}


/* =========================
   项目表单
========================= */

function openItemForm(type,edit){

  editType=type;

  editId=edit||null;

  let t=trip();

  let x=
    edit
    ?
    (t[type]||[])
      .find(
        a=>String(a.id)===String(edit)
      )
    :
    {};

  document.getElementById(
    'modalTitle'
  ).textContent=
    (edit?'编辑':'添加')+
    typeLabel(type);

  let f='';


  if(type==='expense'){

    f=`

      <label>费用名称</label>

      <input
        id="fName"
        value="${esc(x.name||'')}"
        placeholder="例如：熊猫基地门票">


      <div class="row">

        <div>

          <label>金额</label>

          <input
            id="fAmount"
            type="number"
            step="0.01"
            value="${x.amount||''}">

        </div>


        <div>

          <label>日期</label>

          <input
            id="fDate"
            type="date"
            value="${x.date||''}">

        </div>

      </div>


      <label>付款人</label>

      ${memberSelect(
        'fPayer',
        x.payer
      )}


      <label>备注</label>

      <textarea
        id="fNote">${esc(
          x.note||''
        )}</textarea>

    `;

  }


  else if(type==='itinerary'){

    f=commonForm(x,true);

  }


  else if(type==='hotel'){

    f=`

      <label>酒店名称</label>

      <input
        id="fName"
        value="${esc(x.name||'')}"
        placeholder="酒店名称">


      <label>地点</label>

      <input
        id="fPlace"
        value="${esc(x.place||'')}">


      <div class="row">

        <div>

          <label>入住日期</label>

          <input
            id="fStartDate"
            type="date"
            value="${
              x.startDate||
              x.date||
              ''
            }">

        </div>


        <div>

          <label>退房日期</label>

          <input
            id="fEndDate"
            type="date"
            value="${x.endDate||''}">

        </div>

      </div>


      ${memberSelect(
        'fMember',
        x.member
      )}


      <label>备注</label>

      <textarea
        id="fNote">${esc(
          x.note||''
        )}</textarea>


      <label>网页链接</label>

      <input
        id="fLink"
        value="${esc(x.link||'')}">

    `;

  }


  else if(type==='transport'){

    f=`

      <label>交通名称</label>

      <input
        id="fName"
        value="${esc(x.name||'')}"
        placeholder="例如：香港 → 广州">


      <label>路线</label>

      <input
        id="fPlace"
        value="${esc(x.place||'')}">


      <div class="row">

        <div>

          <label>出发日期</label>

          <input
            id="fStartDate"
            type="date"
            value="${
              x.startDate||
              x.date||
              ''
            }">

        </div>


        <div>

          <label>出发时间</label>

          <input
            id="fStartTime"
            type="time"
            value="${
              x.startTime||
              x.time||
              ''
            }">

        </div>

      </div>


      <div class="row">

        <div>

          <label>到达日期</label>

          <input
            id="fEndDate"
            type="date"
            value="${x.endDate||''}">

        </div>


        <div>

          <label>到达时间</label>

          <input
            id="fEndTime"
            type="time"
            value="${x.endTime||''}">

        </div>

      </div>


      ${memberSelect(
        'fMember',
        x.member
      )}


      <label>备注</label>

      <textarea
        id="fNote">${esc(
          x.note||''
        )}</textarea>

    `;

  }


  else{

    f=commonForm(x,false);

  }


  document.getElementById(
    'form'
  ).innerHTML=f;

  showModal();

}


/* =========================
   一般表单
========================= */

function commonForm(x,itinerary){

  return `

    <label>名称</label>

    <input
      id="fName"
      value="${esc(x.name||'')}"
      placeholder="名称">


    <label>地点</label>

    <input
      id="fPlace"
      value="${esc(x.place||'')}">


    <div class="row">

      <div>

        <label>日期</label>

        <input
          id="fDate"
          type="date"
          value="${x.date||''}">

      </div>


      <div>

        <label>时间</label>

        <input
          id="fTime"
          type="time"
          value="${x.time||''}">

      </div>

    </div>


    ${
      itinerary

      ?

      `

      <div class="row">

        <div>

          <label>结束日期</label>

          <input
            id="fEndDate"
            type="date"
            value="${x.endDate||''}">

        </div>


        <div>

          <label>结束时间</label>

          <input
            id="fEndTime"
            type="time"
            value="${x.endTime||''}">

        </div>

      </div>

      `

      :

      ''
    }


    ${memberSelect(
      'fMember',
      x.member
    )}


    <label>备注</label>

    <textarea
      id="fNote">${esc(
        x.note||''
      )}</textarea>


    <label>网页链接</label>

    <input
      id="fLink"
      value="${esc(x.link||'')}">

  `;

}


/* =========================
   成员
========================= */

function memberSelect(id,val){

  return `

    <label>
      谁负责 / 添加
    </label>

    <select id="${id}">

      <option value="">
        请选择
      </option>

      ${
        MEMBERS.map(m=>`

          <option
            value="${m}"
            ${
              val===m
              ? 'selected'
              : ''
            }>

            ${m}

          </option>

        `).join('')
      }

    </select>

  `;

}


/* =========================
   分类名称
========================= */

function typeLabel(t){

  return {

    itinerary:'行程',
    hotel:'酒店',
    transport:'交通',
    sight:'景点',
    shopping:'购物',
    food:'美食',
    expense:'费用'

  }[t]||'';

}


/* =========================
   Modal
========================= */

function showModal(){

  document
    .getElementById('modalBg')
    .classList.add('show');

}

function closeModal(){

  document
    .getElementById('modalBg')
    .classList.remove('show');

}

function val(id){

  return document
    .getElementById(id)
    ?.value||'';

}


/* =========================
   保存
========================= */

function saveForm(){

  /* Trip */

  if(editType==='trip'){

    let name=
      val('fName').trim();

    if(!name)
      return alert(
        '请输入 Trip 名称'
      );

    let members=[
      ...document
        .querySelectorAll(
          '.mcheck:checked'
        )
    ].map(x=>x.value);


    if(editId){

      let t=
        trips.find(
          x=>x.id===editId
        );

      Object.assign(
        t,
        {
          name,
          startDate:
            val('fStart'),
          endDate:
            val('fEnd'),
          members
        }
      );

    }

    else{

      trips.push({

        id:id(),

        name,

        startDate:
          val('fStart'),

        endDate:
          val('fEnd'),

        members,

        itinerary:[],

        hotel:[],

        transport:[],

        sight:[],

        shopping:[],

        food:[],

        expenses:[]

      });

    }

    save();

    closeModal();

    render();

    return;

  }


  let t=trip();

  let x=
    editId
    ?
    (t[editType]||[])
      .find(
        a=>String(a.id)===
           String(editId)
      )
    :
    null;

  let obj=
    x ||
    {
      id:id()
    };


  /* 费用 */

  if(editType==='expense'){

    obj.name=
      val('fName').trim();

    obj.amount=
      Number(
        val('fAmount')||0
      );

    obj.date=
      val('fDate');

    obj.payer=
      val('fPayer');

    obj.note=
      val('fNote');

  }


  /* 行程 */

  else if(editType==='itinerary'){

    Object.assign(
      obj,
      {

        name:
          val('fName').trim(),

        place:
          val('fPlace'),

        date:
          val('fDate'),

        time:
          val('fTime'),

        endDate:
          val('fEndDate'),

        endTime:
          val('fEndTime'),

        member:
          val('fMember'),

        note:
          val('fNote'),

        link:
          val('fLink')

      }
    );

  }


  /* 酒店 */

  else if(editType==='hotel'){

    Object.assign(
      obj,
      {

        name:
          val('fName').trim(),

        place:
          val('fPlace'),

        startDate:
          val('fStartDate'),

        endDate:
          val('fEndDate'),

        member:
          val('fMember'),

        note:
          val('fNote'),

        link:
          val('fLink')

      }
    );

    obj.date=
      obj.startDate;

  }


  /* 交通 */

  else if(editType==='transport'){

    Object.assign(
      obj,
      {

        name:
          val('fName').trim(),

        place:
          val('fPlace'),

        startDate:
          val('fStartDate'),

        startTime:
          val('fStartTime'),

        endDate:
          val('fEndDate'),

        endTime:
          val('fEndTime'),

        member:
          val('fMember'),

        note:
          val('fNote')

      }
    );

    obj.date=
      obj.startDate;

    obj.time=
      obj.startTime;

  }


  /* 景点 / 购物 / 美食 */

  else{

    Object.assign(
      obj,
      {

        name:
          val('fName').trim(),

        place:
          val('fPlace'),

        date:
          val('fDate'),

        time:
          val('fTime'),

        member:
          val('fMember'),

        note:
          val('fNote'),

        link:
          val('fLink')

      }
    );

  }


  if(!obj.name)
    return alert(
      '请输入名称'
    );


  if(!editId){

    t[editType].push(obj);

  }


  syncTimeToLinkedItinerary(
    t,
    editType,
    obj
  );

  save();

  closeModal();

  render();

}


/* =========================
   时间同步
========================= */

function syncTimeToLinkedItinerary(
  t,
  type,
  obj
){

  if(type==='itinerary')
    return;

  if(!obj.itineraryId)
    return;

  let i=
    t.itinerary.find(
      a=>
        String(a.id)===
        String(obj.itineraryId)
    );

  if(!i)
    return;


  if(type==='hotel'){

    i.date=
      obj.startDate ||
      i.date;

  }

  else if(type==='transport'){

    i.date=
      obj.startDate ||
      i.date;

    i.time=
      obj.startTime ||
      i.time;

    i.endDate=
      obj.endDate ||
      i.endDate;

    i.endTime=
      obj.endTime ||
      i.endTime;

  }

  else{

    i.date=
      obj.date ||
      i.date;

    i.time=
      obj.time ||
      i.time;

  }

}


/* =========================
   加进行程
========================= */

function addToItinerary(
  type,
  itemId
){

  let t=trip();

  let x=
    (t[type]||[])
      .find(
        a=>
          String(a.id)===
          String(itemId)
      );

  if(!x)
    return;


  if(
    x.itineraryId &&
    t.itinerary.some(
      i=>
        String(i.id)===
        String(x.itineraryId)
    )
  ){

    return alert(
      '这个项目已经加入行程了'
    );

  }


  let i={

    id:id(),

    name:x.name||'',

    place:x.place||'',

    date:
      x.date||
      x.startDate||
      '',

    time:
      x.time||
      x.startTime||
      '',

    endDate:
      x.endDate||
      '',

    endTime:
      x.endTime||
      '',

    member:
      x.member||
      '',

    note:
      x.note||
      '',

    link:
      x.link||
      '',

    sourceType:type,

    sourceId:x.id

  };


  t.itinerary.push(i);

  x.itineraryId=i.id;

  save();

  alert(
    '已经加入行程'
  );

  render();

}


/* =========================
   删除
========================= */

function deleteItem(
  type,
  itemId
){

  if(!confirm(
    '确定删除吗？'
  ))
    return;


  let t=trip();


  t[type]=
    (t[type]||[])
      .filter(
        x=>
          String(x.id)!==
          String(itemId)
      );


  if(type==='itinerary'){

    t.expenses=
      (t.expenses||[])
        .filter(
          e=>
            String(e.itineraryId)!==
            String(itemId)
        );


    [
      'hotel',
      'transport',
      'sight',
      'shopping',
      'food'
    ]

    .forEach(k=>

      (t[k]||[])
        .forEach(x=>{

          if(
            String(x.itineraryId)===
            String(itemId)
          ){

            delete x.itineraryId;

          }

        })

    );

  }


  save();

  render();

}


/* =========================
   删除 Trip
========================= */

function deleteTrip(i){

  if(!confirm(
    '确定删除这个 Trip 吗？'
  ))
    return;

  trips=
    trips.filter(
      t=>t.id!==i
    );

  save();

  render();

}


/* =========================
   启动
========================= */

render();

</script>
