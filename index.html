<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的记账本</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff8e7 0%,#fff1c9 48%,#f7dfaa 100%);color:#3b3024;min-height:100vh}
.wrap{max-width:950px;margin:auto;padding:20px}h1{margin:0 0 5px;font-size:26px}.sub{color:#777;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.account{border:0;background:rgba(255,255,255,.94);border-radius:18px;padding:18px;text-align:left;box-shadow:0 8px 25px #00000010;cursor:pointer;transition:.18s transform,.18s box-shadow}.account:hover{transform:translateY(-2px);box-shadow:0 12px 30px #00000018}
.account.active{outline:2px solid #c68a2b;background:#fffaf0}.icon{font-size:24px}.name{font-weight:700;font-size:16px;margin-top:7px}.abal{color:#666;margin-top:5px}
.card{background:rgba(255,255,255,.96);border-radius:20px;padding:20px;box-shadow:0 10px 32px #00000010}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:linear-gradient(135deg,#fffaf0,#fff2d4);border-radius:15px;padding:15px}.stat small{color:#777}.stat b{display:block;font-size:20px;margin-top:5px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 15px;background:#b97820;color:#fff;cursor:pointer}.filter{border:0;border-radius:18px;padding:8px 13px;cursor:pointer}.filter.on{background:#b97820;color:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:11px 7px;text-align:left;border-bottom:1px solid #eee}th{color:#777;font-size:13px}.income{color:#16824b;font-weight:bold}.expense{color:#c43d3d;font-weight:bold}.empty{text-align:center;color:#999;padding:32px}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:16px;padding:20px;width:min(450px,100%)}
label{display:block;color:#666;font-size:13px;margin:11px 0 5px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.light{background:#eee;color:#222}
.delete{border:0;background:none;cursor:pointer;color:#999}.accountWrap{position:relative}.removeAccount{position:absolute;right:9px;top:8px;border:0;background:#fff3;border-radius:50%;font-size:15px;cursor:pointer;color:#8d6b3e;z-index:2;padding:5px 7px}.removeAccount:hover{background:#f4dfb9}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr}.wrap{padding:12px}table{font-size:12px}th:nth-child(2),td:nth-child(2){display:none}}
</style></head>
<body>
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#fff8f0">
  <div style="width:min(570px,94vw);background:white;border-radius:36px;padding:65px 36px;text-align:center;box-shadow:0 18px 55px #8b5d3018">
    <div style="font-size:58px">🔐</div>
    <h1 style="font-size:36px;margin:22px 0 18px;color:#4b2b16">我的记账本</h1>
    <div style="font-size:19px;color:#b07a5d;margin-bottom:30px">请输入密码才能进入 💗</div>
    <input id="loginPassword" type="password" inputmode="numeric" placeholder="请输入密码"
      style="width:100%;padding:20px;border:2px solid #f0a06c;border-radius:20px;background:#edf4ff;font-size:22px;text-align:center;letter-spacing:8px;outline:none"
      onkeydown="if(event.key==='Enter')unlockApp()">
    <button onclick="unlockApp()" style="width:100%;margin-top:18px;border:0;border-radius:18px;padding:18px;background:#ea9864;color:white;font-size:20px;font-weight:bold;cursor:pointer">进入记账本 💗</button>
    <div id="loginError" style="height:24px;margin-top:12px;color:#c34c4c"></div>
    <div style="margin-top:10px;font-size:13px;color:#aaa">首次使用密码：123456<br>进入后可在页面上修改密码</div>
  </div>
</div>
<div class="wrap" id="mainApp" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><div><h1>📒 我的记账本</h1><div class="sub">收入、支出和余额一目了然</div></div><button class="btn light" onclick="changePassword()">🔑 修改密码</button></div>
<div class="toolbar" style="margin-top:4px">
<div><b>我的账户</b><div style="font-size:13px;color:#806a4d;margin-top:3px">可以自由新增或删除账户</div></div>
<button class="btn" onclick="addAccount()">＋ 新增账户</button>
</div>
<div class="grid" id="accounts"></div>
<div class="card"><h2 id="title" style="margin-top:0"></h2>
<div class="summary"><div class="stat"><small>总收入</small><b id="income"></b></div><div class="stat"><small>总支出</small><b id="expense"></b></div><div class="stat"><small>目前余额</small><b id="balance"></b></div></div>
<div class="toolbar"><button class="btn" onclick="openM()">＋ 增加记录</button><div><button class="filter on" onclick="sf('all',this)">全部</button> <button class="filter" onclick="sf('income',this)">收入</button> <button class="filter" onclick="sf('expense',this)">支出</button></div></div>
<div id="list"></div></div></div>
<div class="modal" id="modal"><div class="box"><h2 style="margin-top:0">增加记录</h2>
<label>日期</label><input id="date" type="date">
<div class="row"><div><label>类型</label><select id="type"><option value="income">收入</option><option value="expense">支出</option></select></div><div><label>币种（CURRENCY）</label><select id="currency"><option value="MYR">🇲🇾 MYR</option><option value="SGD">🇸🇬 SGD</option><option value="USD">🇺🇸 USD</option><option value="CNY">🇨🇳 CNY</option></select></div></div>
<label>金额</label><input id="amount" type="number" min="0" step=".01" placeholder="0.00">
<label>分类</label><input id="category" placeholder="例如：薪水、吃饭、购物、装修">
<label>备注（REMARK）</label><input id="remark" placeholder="输入备注">
<div class="ma"><button class="btn light" onclick="closeM()">取消</button><button class="btn" onclick="save()">保存</button></div></div></div>
<script>
let names=JSON.parse(localStorage.getItem("zhLedgerAccounts")||'["UOB（我）","UOB（老公）","妈妈（马来西亚）","妈妈（新加坡）","爸爸","UNCLE","新公寓"]');
let icons=JSON.parse(localStorage.getItem("zhLedgerIcons")||'["💳","💳","👩","👩","👨","👨","🏠"]');
let data=JSON.parse(localStorage.getItem("zhLedger")||"{}"); names.forEach(n=>data[n]??=[]);
let current=names[0]||"", filter="all";
const symbols={MYR:"RM",SGD:"S$",USD:"US$",CNY:"¥"};
const money=(n,c="MYR")=>(symbols[c]||c)+" "+Number(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function totals(n){
 let out={};
 data[n].forEach(x=>{let c=x.currency||"MYR";out[c]??={income:0,expense:0};out[c][x.type]+=x.amount});
 return out;
}
function multi(t,kind){let a=Object.entries(t).filter(([c,v])=>v[kind]!==0).map(([c,v])=>money(v[kind],c));return a.length?a.join(" / "):money(0,"MYR")}
function multibal(t){let a=Object.entries(t).filter(([c,v])=>v.income-v.expense!==0).map(([c,v])=>money(v.income-v.expense,c));return a.length?a.join(" / "):money(0,"MYR")}
function render(){
 document.getElementById("accounts").innerHTML=names.map((n,i)=>{let t=totals(n);return `<div class="accountWrap"><button class="removeAccount" title="删除账户" onclick="event.stopPropagation();removeAccount(${i})">✕</button><button style="width:100%;height:100%" class="account ${n==current?'active':''}" onclick="pick(${i})"><div class=icon>${icons[i]||"💰"}</div><div class=name>${esc(n)}</div><div class=abal>余额：${multibal(t)}</div></button></div>`}).join("");
 if(!current || !names.length){
 title.textContent="还没有账户"; income.textContent=money(0,"MYR"); expense.textContent=money(0,"MYR"); balance.textContent=money(0,"MYR");
 list.innerHTML='<div class=empty>请先点击「＋ 新增账户」</div>';
 localStorage.setItem("zhLedgerAccounts",JSON.stringify(names));localStorage.setItem("zhLedgerIcons",JSON.stringify(icons));return;
 }
 let t=totals(current); title.textContent=current; income.textContent=multi(t,"income");expense.textContent=multi(t,"expense");balance.textContent=multibal(t);
 let rows=data[current].map((r,i)=>({...r,_i:i})).filter(r=>filter=="all"||r.type==filter).sort((a,b)=>b.date.localeCompare(a.date)||b._i-a._i);
 list.innerHTML=rows.length?`<table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>币种</th><th>金额</th><th>REMARK</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date.split("-").reverse().join("/")}</td><td>${r.type=="income"?"收入":"支出"}</td><td>${esc(r.category)}</td><td>${r.currency||"MYR"}</td><td class=${r.type}>${r.type=="income"?"+":"-"}${money(r.amount,r.currency||"MYR")}</td><td>${esc(r.remark)}</td><td><button class=delete onclick="del(${r._i})">🗑️</button></td></tr>`).join("")}</tbody></table>`:`<div class=empty>还没有记录<br>点击「＋ 增加记录」开始记账</div>`;
 localStorage.setItem("zhLedger",JSON.stringify(data));localStorage.setItem("zhLedgerAccounts",JSON.stringify(names));localStorage.setItem("zhLedgerIcons",JSON.stringify(icons));
}
function pick(i){current=names[i];filter="all";document.querySelectorAll(".filter").forEach((x,j)=>x.classList.toggle("on",j==0));render()}
function sf(f,e){filter=f;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("on"));e.classList.add("on");render()}
function openM(){date.value=new Date().toISOString().slice(0,10);amount.value="";category.value="";remark.value="";
 currency.value=(current==="妈妈（新加坡）"||current.startsWith("UOB"))?"SGD":"MYR";
 modal.classList.add("show")}
function closeM(){modal.classList.remove("show")}
function save(){let a=Number(amount.value);if(!date.value||!a){alert("请填写日期和金额");return}data[current].push({date:date.value,type:type.value,currency:currency.value,amount:a,category:category.value||"未分类",remark:remark.value||""});closeM();render()}
function del(i){if(confirm("确定删除这笔记录吗？")){data[current].splice(i,1);render()}}
function addAccount(){
 let n=prompt("请输入新账户名称：\n例如：爸爸、旅行基金、房子");
 if(!n)return;n=n.trim();if(!n)return;
 if(names.includes(n)){alert("这个账户已经存在");return}
 names.push(n);icons.push("💰");data[n]=[];current=n;render();
}
function removeAccount(i){
 let n=names[i];
 if(!confirm(`确定删除「${n}」吗？\n\n这个账户里面的所有收入和支出记录也会一起删除。`))return;
 delete data[n];names.splice(i,1);icons.splice(i,1);
 if(current===n)current=names[0]||"";
 render();
}

const PASSKEY="zhLedgerPassword";
if(!localStorage.getItem(PASSKEY)) localStorage.setItem(PASSKEY,"123456");
function unlockApp(){
 const entered=document.getElementById("loginPassword").value;
 if(entered===localStorage.getItem(PASSKEY)){
   document.getElementById("loginScreen").style.display="none";
   document.getElementById("mainApp").style.display="block";
   document.getElementById("loginError").textContent="";
 }else{
   document.getElementById("loginError").textContent="密码不正确，请再试一次";
   document.getElementById("loginPassword").value="";
   document.getElementById("loginPassword").focus();
 }
}
function changePassword(){
 let oldp=prompt("请输入目前密码：");
 if(oldp===null)return;
 if(oldp!==localStorage.getItem(PASSKEY)){alert("目前密码不正确");return}
 let newp=prompt("请输入新密码（至少4位）：");
 if(newp===null)return;
 newp=newp.trim();
 if(newp.length<4){alert("新密码至少需要4位");return}
 let confirmP=prompt("请再输入一次新密码：");
 if(confirmP!==newp){alert("两次输入的新密码不一样");return}
 localStorage.setItem(PASSKEY,newp);
 alert("密码已修改");
}
render();
</script></body></html>
