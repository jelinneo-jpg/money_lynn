<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#f3a77f">

<title>Travel App</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background: #fff8f3;
  color: #4a403b;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   首页
========================= */

.app {
  min-height: 100vh;
}

.header {
  padding: 22px 18px 16px;
  background: #f3a77f;
  color: white;
}

.header-title {
  font-size: 25px;
  font-weight: 700;
}

.header-subtitle {
  margin-top: 5px;
  font-size: 13px;
  opacity: .9;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 18px;
}

/* =========================
   按钮
========================= */

.btn {
  border: 0;
  border-radius: 12px;
  padding: 11px 16px;
  background: #f3a77f;
  color: white;
  font-weight: 600;
}

.btn:active {
  transform: scale(.98);
}

.btn-light {
  background: #fff;
  color: #e78f62;
  border: 1px solid #f1c5ad;
}

.btn-danger {
  background: #e87878;
}

.btn-small {
  padding: 8px 11px;
  font-size: 13px;
  border-radius: 9px;
}

/* =========================
   首页 Trip
========================= */

.section-title {
  font-size: 19px;
  font-weight: 700;
  margin: 4px 0 14px;
}

.trip-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.trip-card {
  background: white;
  border-radius: 16px;
  padding: 17px;
  box-shadow: 0 2px 10px rgba(80,50,30,.06);
  border: 1px solid #f5e3d8;
}

.trip-name {
  font-size: 18px;
  font-weight: 700;
  color: #493d36;
}

.trip-date {
  margin-top: 7px;
  color: #8d7b70;
  font-size: 13px;
}

.trip-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.empty {
  background: white;
  border-radius: 15px;
  padding: 30px 20px;
  text-align: center;
  color: #a28f84;
  border: 1px solid #f1e2d9;
}

/* =========================
   Trip 页面
========================= */

.trip-header {
  background: white;
  border-bottom: 1px solid #f0ded4;
  position: sticky;
  top: 0;
  z-index: 10;
}

.trip-header-inner {
  max-width: 900px;
  margin: auto;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.back-btn {
  border: 0;
  background: transparent;
  font-size: 22px;
  padding: 3px;
}

.trip-header-name {
  flex: 1;
  font-size: 17px;
  font-weight: 700;
}

/* =========================
   主分类
========================= */

.main-tabs {
  background: white;
  border-bottom: 1px solid #f0ded4;
  overflow-x: auto;
  white-space: nowrap;
}

.main-tabs-inner {
  max-width: 900px;
  margin: auto;
  display: flex;
  padding: 0 10px;
}

.main-tab {
  border: 0;
  background: transparent;
  padding: 14px 12px;
  color: #8d7b70;
  font-weight: 600;
  font-size: 14px;
  position: relative;
}

.main-tab.active {
  color: #e78f62;
}

.main-tab.active::after {
  content: "";
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 0;
  height: 3px;
  background: #f3a77f;
  border-radius: 3px 3px 0 0;
}

/* =========================
   子分类
========================= */

.sub-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
}

.sub-tab {
  border: 1px solid #efd7ca;
  background: white;
  color: #8d776a;
  border-radius: 20px;
  padding: 8px 15px;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 600;
}

.sub-tab.active {
  background: #f3a77f;
  border-color: #f3a77f;
  color: white;
}

/* =========================
   内容
========================= */

.page {
  padding-bottom: 80px;
}

.page-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 15px;
}

.page-title {
  font-size: 20px;
  font-weight: 700;
}

.card-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* =========================
   日期
========================= */

.day {
  margin-bottom: 22px;
}

.day-title {
  font-size: 16px;
  font-weight: 700;
  color: #df875b;
  margin: 3px 0 10px;
  padding-left: 4px;
}

.item-card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  border: 1px solid #f1e0d7;
  box-shadow: 0 2px 8px rgba(80,50,30,.04);
}

.item-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.item-icon {
  font-size: 23px;
  width: 30px;
  text-align: center;
}

.item-main {
  flex: 1;
  min-width: 0;
}

.item-title {
  font-size: 16px;
  font-weight: 700;
}

.item-time {
  margin-top: 4px;
  color: #e78f62;
  font-size: 13px;
  font-weight: 600;
}

.item-place {
  margin-top: 5px;
  color: #75665e;
  font-size: 13px;
}

.item-note {
  margin-top: 8px;
  color: #8d817b;
  font-size: 13px;
  line-height: 1.5;
}

.item-actions {
  display: flex;
  gap: 7px;
  margin-top: 12px;
  flex-wrap: wrap;
}

/* =========================
   Modal
========================= */

.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal {
  width: 100%;
  max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  background: #fffaf7;
  border-radius: 22px 22px 0 0;
  padding: 20px;
}

.modal-title {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 17px;
}

.form-group {
  margin-bottom: 13px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #6d5d54;
}

.form-input {
  width: 100%;
  border: 1px solid #e9d8ce;
  background: white;
  border-radius: 11px;
  padding: 11px 12px;
  outline: none;
}

.form-input:focus {
  border-color: #f3a77f;
}

.form-row {
  display: flex;
  gap: 10px;
}

.form-row > * {
  flex: 1;
}

.modal-actions {
  display: flex;
  gap: 9px;
  margin-top: 20px;
}

.modal-actions .btn {
  flex: 1;
}

/* =========================
   手机
========================= */

@media (max-width: 600px) {

  .container {
    padding: 15px;
  }

  .main-tab {
    padding-left: 10px;
    padding-right: 10px;
    font-size: 13px;
  }

  .trip-actions .btn {
    flex: 1;
  }

  .form-row {
    flex-direction: column;
    gap: 0;
  }

}

</style>
</head>


<body>

<div id="app"></div>


<script>

/* =========================================================
   基本资料
========================================================= */

const MEMBERS = [
  "Lynn",
  "Vincent",
  "Esther",
  "Tong"
];

let trips = [];

let currentTripId = null;

let currentPage = "home";

let currentSubPage = "hotel";

let editingType = null;

let editingId = null;


/* =========================================================
   工具
========================================================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function createId() {

  return Date.now() +
    Math.floor(Math.random() * 10000);
}


function formatDate(date) {

  if (!date) {
    return "";
  }

  const parts = date.split("-");

  if (parts.length !== 3) {
    return date;
  }

  return `${parts[0]}/${parts[1]}/${parts[2]}`;
}


function saveTrips() {

  localStorage.setItem(
    "travelTrips",
    JSON.stringify(trips)
  );
}


function getCurrentTrip() {

  return trips.find(
    trip => String(trip.id) === String(currentTripId)
  );
}


/* =========================================================
   新 Trip
========================================================= */

function createEmptyTrip(name, startDate, endDate) {

  return {

    id: createId(),

    name:
      name ||
      "新的旅行",

    startDate:
      startDate ||
      "",

    endDate:
      endDate ||
      "",

    members: [...MEMBERS],

    itinerary: [],

    hotel: [],

    transport: [],

    sight: [],

    shopping: [],

    food: [],

    expense: [],

    places: []

  };

}


/* =========================================================
   旧资料转换
========================================================= */

function migrateTrip(trip) {

  if (!trip) {
    return createEmptyTrip();
  }

  trip.itinerary =
    Array.isArray(trip.itinerary)
      ? trip.itinerary
      : [];

  trip.hotel =
    Array.isArray(trip.hotel)
      ? trip.hotel
      : [];

  trip.transport =
    Array.isArray(trip.transport)
      ? trip.transport
      : [];

  trip.sight =
    Array.isArray(trip.sight)
      ? trip.sight
      : [];

  trip.shopping =
    Array.isArray(trip.shopping)
      ? trip.shopping
      : [];

  trip.food =
    Array.isArray(trip.food)
      ? trip.food
      : [];

  trip.expense =
    Array.isArray(trip.expense)
      ? trip.expense
      : [];

  trip.places =
    Array.isArray(trip.places)
      ? trip.places
      : [];


  /*
    旧版 transport
    date → startDate
    time → startTime
  */

  trip.transport.forEach(item => {

    if (!item.startDate && item.date) {
      item.startDate = item.date;
    }

    if (!item.startTime && item.time) {
      item.startTime = item.time;
    }

  });


  /*
    旧版 places
    scenic → sight
    food   → food
  */

  const hasNewPlaceData =
    trip.sight.length > 0 ||
    trip.food.length > 0 ||
    trip.shopping.length > 0;


  if (
    trip.places.length > 0 &&
    !hasNewPlaceData
  ) {

    trip.places.forEach(item => {

      const category =
        item.category === "scenic" ||
        item.category === "景点"
          ? "sight"
          : "food";

      trip[category].push({
        ...item
      });

    });

  }


  return trip;
}


/* =========================================================
   载入资料
========================================================= */

function loadTrips() {

  try {

    const saved =
      localStorage.getItem("travelTrips");

    if (saved) {

      const parsed =
        JSON.parse(saved);

      if (Array.isArray(parsed)) {

        trips =
          parsed.map(
            migrateTrip
          );

        return;

      }

    }

  } catch (error) {

    console.error(
      "读取旅行资料失败",
      error
    );

  }


  /*
    第一次使用时的示范 Trip
  */

  trips = [

    {

      id: 1,

      name:
        "🇭🇰 香港 → 广州 → 成都 → 三江",

      startDate:
        "2026-11-06",

      endDate:
        "2026-11-15",

      members: [
        "Lynn",
        "Vincent",
        "Esther",
        "Tong"
      ],

      itinerary: [

        {
          id: 101,
          date: "2026-11-06",
          time: "10:00",
          title: "✈️ 新加坡 → 香港",
          place: "香港机场",
          member: "Lynn",
          note: "抵达后前往酒店"
        },

        {
          id: 102,
          date: "2026-11-06",
          time: "16:00",
          title: "🏨 酒店 Check-in",
          place: "九龙",
          member: "Vincent"
        },

        {
          id: 103,
          date: "2026-11-07",
          time: "19:00",
          title: "🍜 晚餐",
          place: "尖沙咀",
          member: "Esther"
        },

        {
          id: 104,
          date: "2026-11-08",
          time: "12:30",
          endTime: "13:30",
          title: "🚄 香港 → 广州",
          place: "香港西九龙 → 广州南",
          member: "Tong",
          note: "高铁"
        }

      ],

      hotel: [],

      transport: [],

      sight: [],

      shopping: [],

      food: [],

      expense: [],

      places: []

    }

  ];


  trips =
    trips.map(migrateTrip);

  saveTrips();

}


/* =========================================================
   初始化
========================================================= */

function init() {

  loadTrips();

  currentPage = "home";

  render();

}


init();

/* =========================================================
   第 2 部分
   📅 行程
========================================================= */


/* =========================================================
   日期显示
========================================================= */

function formatDayTitle(date) {

  if (!date) {
    return "未设日期";
  }

  const d = new Date(date + "T00:00:00");

  if (isNaN(d.getTime())) {
    return date;
  }

  const weekNames = [
    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"
  ];

  return (
    formatDate(date) +
    " · " +
    weekNames[d.getDay()]
  );
}


/* =========================================================
   行程排序
========================================================= */

function sortItinerary(items) {

  return [...items].sort((a, b) => {

    const dateA =
      a.date || "9999-99-99";

    const dateB =
      b.date || "9999-99-99";

    if (dateA !== dateB) {
      return dateA.localeCompare(dateB);
    }

    const timeA =
      a.time || "99:99";

    const timeB =
      b.time || "99:99";

    return timeA.localeCompare(timeB);

  });

}


/* =========================================================
   行程图标
========================================================= */

function getItineraryIcon(item) {

  if (item.icon) {
    return item.icon;
  }

  if (item.sourceType === "hotel") {
    return "🏨";
  }

  if (item.sourceType === "transport") {
    return "🚄";
  }

  if (item.sourceType === "sight") {
    return "🏞️";
  }

  if (item.sourceType === "shopping") {
    return "🛍️";
  }

  if (item.sourceType === "food") {
    return "🍜";
  }

  return "📍";
}


/* =========================================================
   行程来源名称
========================================================= */

function getSourceLabel(type) {

  const labels = {

    hotel: "酒店",

    transport: "交通",

    sight: "景点",

    shopping: "购物",

    food: "美食"

  };

  return labels[type] || "";
}


/* =========================================================
   判断行程是否来自其他分类
========================================================= */

function getLinkedSource(item, trip) {

  if (
    !item.sourceType ||
    !item.sourceId
  ) {
    return null;
  }

  const list =
    trip[item.sourceType];

  if (!Array.isArray(list)) {
    return null;
  }

  return list.find(
    x =>
      String(x.id) ===
      String(item.sourceId)
  ) || null;

}


/* =========================================================
   渲染行程
========================================================= */

function renderItinerary(content) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const items =
    sortItinerary(
      trip.itinerary || []
    );


  content.innerHTML = `

    <div class="page">

      <div class="page-title-row">

        <div class="page-title">
          📅 行程
        </div>

        <button
          class="btn btn-small"
          onclick="openItemModal('itinerary')">

          ＋ 添加

        </button>

      </div>

      <div id="itineraryList"></div>

    </div>

  `;


  const list =
    document.getElementById(
      "itineraryList"
    );


  if (items.length === 0) {

    list.innerHTML = `

      <div class="empty">

        目前还没有行程

        <br><br>

        <button
          class="btn"
          onclick="openItemModal('itinerary')">

          ＋ 添加第一项行程

        </button>

      </div>

    `;

    return;

  }


  /*
    按日期分组
  */

  const groups = {};


  items.forEach(item => {

    const date =
      item.date ||
      "未设日期";

    if (!groups[date]) {
      groups[date] = [];
    }

    groups[date].push(item);

  });


  Object.keys(groups)
    .sort()
    .forEach(date => {

      const day =
        document.createElement("div");

      day.className = "day";


      day.innerHTML = `

        <div class="day-title">

          ${escapeHTML(
            formatDayTitle(date)
          )}

        </div>

        <div class="card-list"></div>

      `;


      const cardList =
        day.querySelector(
          ".card-list"
        );


      groups[date].forEach(item => {

        cardList.insertAdjacentHTML(
          "beforeend",
          renderItineraryCard(item)
        );

      });


      list.appendChild(day);

    });

}


/* =========================================================
   行程卡片
========================================================= */

function renderItineraryCard(item) {

  const trip =
    getCurrentTrip();


  const source =
    getLinkedSource(
      item,
      trip
    );


  const sourceLabel =
    item.sourceType
      ? getSourceLabel(
          item.sourceType
        )
      : "";


  let timeText = "";


  if (item.time) {

    timeText =
      escapeHTML(item.time);

    if (item.endTime) {

      timeText +=
        " – " +
        escapeHTML(
          item.endTime
        );

    }

  }


  let info = "";


  if (item.place) {

    info += `

      <div class="item-place">

        📍
        ${escapeHTML(item.place)}

      </div>

    `;

  }


  if (item.member) {

    info += `

      <div class="item-place">

        👤
        ${escapeHTML(item.member)}

      </div>

    `;

  }


  if (item.note) {

    info += `

      <div class="item-note">

        ${escapeHTML(item.note)}

      </div>

    `;

  }


  if (sourceLabel) {

    info += `

      <div class="category-badge">

        ${getItineraryIcon(item)}
        来自${escapeHTML(sourceLabel)}

      </div>

    `;

  }


  return `

    <div class="item-card">

      <div class="item-top">

        <div class="item-icon">

          ${getItineraryIcon(item)}

        </div>

        <div class="item-main">

          <div class="item-title">

            ${escapeHTML(
              item.title ||
              "未命名行程"
            )}

          </div>

          ${
            timeText
              ? `
                <div class="item-time">
                  🕐 ${timeText}
                </div>
              `
              : ""
          }

          ${info}

        </div>

      </div>


      <div class="item-actions">

        <button
          class="btn btn-small"
          onclick="openItemModal(
            'itinerary',
            ${item.id}
          )">

          ✏️ 编辑

        </button>


        ${
          source
            ? `
              <button
                class="btn btn-light btn-small"
                onclick="openLinkedSource(
                  '${item.sourceType}',
                  ${item.sourceId}
                )">

                查看${escapeHTML(sourceLabel)}

              </button>
            `
            : ""
        }


        <button
          class="btn btn-danger btn-small"
          onclick="deleteItem(
            'itinerary',
            ${item.id}
          )">

          删除

        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   打开关联资料
========================================================= */

function openLinkedSource(
  type,
  id
) {

  if (
    !type ||
    !id
  ) {
    return;
  }


  if (
    [
      "hotel",
      "transport",
      "sight",
      "shopping",
      "food"
    ].includes(type)
  ) {

    currentPage = type;

    currentSubPage = type;

    render();

  }

}


/* =========================================================
   添加行程
========================================================= */

function addItineraryFromSource(
  type,
  sourceId
) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const source =
    trip[type]?.find(
      item =>
        String(item.id) ===
        String(sourceId)
    );


  if (!source) {
    return;
  }


  /*
    如果已经有对应行程
    就不要重复添加
  */

  const existing =
    trip.itinerary.find(
      item =>
        item.sourceType === type &&
        String(item.sourceId) ===
        String(sourceId)
    );


  if (existing) {

    alert(
      "这个项目已经加入行程了。"
    );

    return;

  }


  const item = {

    id: createId(),

    title:
      source.name ||
      source.title ||
      getSourceLabel(type),

    place:
      source.place ||
      "",

    note:
      source.note ||
      "",

    member:
      source.member ||
      "",

    date:
      source.startDate ||
      source.date ||
      "",

    time:
      source.startTime ||
      source.time ||
      "",

    endDate:
      source.endDate ||
      source.startDate ||
      source.date ||
      "",

    endTime:
      source.endTime ||
      "",

    sourceType:
      type,

    sourceId:
      source.id

  };


  trip.itinerary.push(item);


  /*
    同时记录来源的 itineraryId
  */

/* =========================================================
   行程 → 来源
   日期 / 时间同步
========================================================= */

function syncItineraryToSource(
  itinerary
) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  if (
    !itinerary.sourceType ||
    !itinerary.sourceId
  ) {
    return;
  }


  const source =
    trip[itinerary.sourceType]
      ?.find(
        item =>
          String(item.id) ===
          String(itinerary.sourceId)
      );


  if (!source) {
    return;
  }


  /*
    酒店
  */

  if (
    itinerary.sourceType ===
    "hotel"
  ) {

    source.startDate =
      itinerary.date || "";

    source.endDate =
      itinerary.endDate ||
      itinerary.date ||
      "";

  }


  /*
    交通 / 景点 /
    购物 / 美食
  */

  else {

    source.startDate =
      itinerary.date || "";

    source.startTime =
      itinerary.time || "";

    source.endDate =
      itinerary.endDate ||
      itinerary.date ||
      "";

    source.endTime =
      itinerary.endTime ||
      "";

  }

}


/* =========================================================
   来源 → 行程
   日期 / 时间同步
========================================================= */

function syncSourceToItinerary(
  type,
  source
) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const itinerary =
    trip.itinerary.find(
      item =>
        item.sourceType === type &&
        String(item.sourceId) ===
        String(source.id)
    );


  if (!itinerary) {
    return;
  }


  /*
    酒店
  */

  if (type === "hotel") {

    itinerary.date =
      source.startDate || "";

    itinerary.endDate =
      source.endDate ||
      source.startDate ||
      "";

    /*
      酒店没有必要强制时间
    */

  }

  else {

    itinerary.date =
      source.startDate || "";

    itinerary.time =
      source.startTime || "";

    itinerary.endDate =
      source.endDate ||
      source.startDate ||
      "";

    itinerary.endTime =
      source.endTime ||
      "";

  }

}


/* =========================================================
   删除行程
========================================================= */

function deleteItinerary(
  id
) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const item =
    trip.itinerary.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if (!item) {
    return;
  }


  if (
    !confirm(
      "确定要删除这项行程吗？"
    )
  ) {

    return;

  }


  /*
    如果来自酒店 / 交通 /
    景点 / 购物 / 美食，
    同时清掉来源的 itineraryId
  */

  if (
    item.sourceType &&
    item.sourceId
  ) {

    const source =
      trip[item.sourceType]
        ?.find(
          x =>
            String(x.id) ===
            String(item.sourceId)
        );


    if (source) {

      delete source.itineraryId;

    }

  }


  /*
    删除行程时，
    同时删除关联费用
  */

  trip.expense =
    (trip.expense || [])
      .filter(
        expense =>
          String(expense.itineraryId) !==
          String(id)
      );


  trip.itinerary =
    trip.itinerary.filter(
      x =>
        String(x.id) !==
        String(id)
    );


  saveTrips();

  render();

}


/* =========================================================
   统一删除
========================================================= */

function deleteItem(
  type,
  id
) {

  if (
    type === "itinerary"
  ) {

    deleteItinerary(id);

    return;

  }


  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const list =
    trip[type];

  if (!Array.isArray(list)) {
    return;
  }


  const item =
    list.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if (!item) {
    return;
  }


  if (
    !confirm(
      "确定要删除吗？"
    )
  ) {

    return;

  }


  /*
    如果删除的是来源资料，
    一起删除对应行程
  */

  const linkedItinerary =
    trip.itinerary.find(
      itinerary =>
        itinerary.sourceType === type &&
        String(itinerary.sourceId) ===
        String(id)
    );


  if (linkedItinerary) {

    trip.itinerary =
      trip.itinerary.filter(
        itinerary =>
          itinerary !==
          linkedItinerary
      );


    /*
      对应费用也删除
    */

    trip.expense =
      (trip.expense || [])
        .filter(
          expense =>
            String(
              expense.itineraryId
            ) !==
            String(
              linkedItinerary.id
            )
        );

  }


  trip[type] =
    list.filter(
      x =>
        String(x.id) !==
        String(id)
    );


  saveTrips();

  render();

}

    sight: "🏞️ 景点",

========================================================= */

function openItemModal(
  type,
  id = null
) {

  editingType = type;
  editingId = id;

  const trip = getCurrentTrip();

  if (!trip) {
    return;
  }


  let item = null;


  if (id !== null) {

    item =
      trip[type]?.find(
        x =>
          String(x.id) ===
          String(id)
      ) || null;

  }


  const isEdit =
    !!item;


  const modalMask =
    document.createElement("div");

  modalMask.className =
    "modal-mask";

  modalMask.id =
    "itemModal";


  modalMask.innerHTML = `

    <div
      class="modal"
      onclick="event.stopPropagation()">

      <div class="modal-title">

        ${
          isEdit
            ? "✏️ 编辑 "
            : "＋ 添加 "
        }

        ${getTypeTitle(type)}

      </div>


      <form
        id="itemForm"
        onsubmit="saveItemModal(event)">

        ${buildItemForm(
          type,
          item
        )}


        <div class="modal-actions">

          <button
            type="button"
            class="btn btn-light"
            onclick="closeItemModal()">

            取消

          </button>


          <button
            type="submit"
            class="btn">

            ${isEdit ? "保存修改" : "添加"}

          </button>

        </div>

      </form>

    </div>

  `;


  document.body.appendChild(
    modalMask
  );


  /*
    点击背景关闭
  */

  modalMask.addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        modalMask
      ) {

        closeItemModal();

      }

    }
  );

}

function closeItemModal() {

  const modal =
    document.getElementById(

    modal.remove();

  }


  editingType = null;

  editingId = null;

}


/* =========================================================
   保存 Modal
========================================================= */

function saveItemModal(event) {

  event.preventDefault();


  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const form =
    event.target;

  const data =
    new FormData(form);


  const values =
    Object.fromEntries(
      data.entries()
    );


  const type =
    editingType;

  const id =
    editingId;


  /*
    编辑
  */

  if (id !== null) {

    const item =
      trip[type]?.find(
        x =>
          String(x.id) ===
          String(id)
      );


    if (!item) {

      closeItemModal();

      return;

    }


    Object.assign(
      item,
      values
    );


    /*
      数字 / ID 保留
    */

    item.id = id;


    /*
      如果编辑的是行程
      → 同步来源
    */

    if (
      type ===
      "itinerary"
    ) {

      syncItineraryToSource(
        item
      );

    }


    /*
      如果编辑的是酒店 /
      交通 / 景点 / 购物 / 美食
      → 同步行程
    */

    else {

      syncSourceToItinerary(
        type,
        item
      );

    }

  }


  /*
    新增
  */

  else {

    const newItem = {

      id: createId(),

      ...values

    };


    if (!Array.isArray(
      trip[type]
    )) {

      trip[type] = [];

    }


    trip[type].push(
      newItem
    );

  }


  saveTrips();

  closeItemModal();

  render();

}

/* =========================================================

========================================================= */

function getAllItineraries() {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return [];
  }

  return Array.isArray(
    trip.itinerary
  )
    ? trip.itinerary
    : [];
}


/* =========================================================
   费用：格式化金额
========================================================= */

function formatMoney(value) {

  const number =
    Number(value) || 0;

  return number.toFixed(2);

}


/* =========================================================
   费用：付款人
========================================================= */

function getExpensePayer(
  expense
) {

  return (
    expense.paidBy ||
    expense.member ||
    ""
  );

}


/* =========================================================
   费用：分摊人
========================================================= */

function getExpenseMembers(
  expense
) {

  if (
    Array.isArray(
      expense.splitMembers
    )
  ) {

    return expense.splitMembers;

  }


  if (
    Array.isArray(
      expense.members
    )
  ) {

    return expense.members;

  }


  return [];

}


/* =========================================================
   费用：关联行程名称
========================================================= */

function getExpenseItineraryName(
  expense
) {

  if (
    !expense.itineraryId
  ) {

    return "";

  }


  const trip =
    getCurrentTrip();

  if (!trip) {
    return "";
  }


  const item =
    trip.itinerary.find(
      x =>
        String(x.id) ===
        String(
          expense.itineraryId
        )
    );


  return item
    ? item.title || "未命名行程"
    : "";

}


/* =========================================================
   💰 渲染费用页面
========================================================= */

function renderExpenses(
  content
) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  if (
    !Array.isArray(
      trip.expense
    )
  ) {

    trip.expense = [];

  }


  const expenses =
    trip.expense;


  const total =
    expenses.reduce(
      (
        sum,
        item
      ) =>
        sum +
        (
          Number(
            item.amount
          ) || 0
        ),
      0
    );


  content.innerHTML = `

    <div class="page-header">

      <div>

        <h2>
          💰 费用
        </h2>

        <div class="page-subtitle">
          ${expenses.length} 笔费用
        </div>

      </div>


      <button
        class="btn"
        onclick="openItemModal('expense')">

        ＋ 添加费用

      </button>

    </div>


    <div class="expense-summary">

      <div class="expense-total-label">
        总费用
      </div>

      <div class="expense-total">
        ¥ ${formatMoney(total)}
      </div>

    </div>


    ${
      expenses.length === 0

        ? `

          <div class="empty">

            <div class="empty-icon">
              💰
            </div>

            <div>
              还没有费用
            </div>

            <button
              class="btn"
              onclick="openItemModal('expense')">

              ＋ 添加第一笔费用

            </button>

          </div>

        `

        :

          <div class="item-list">

            ${expenses
              .map(
                expense =>
                  renderExpenseCard(

              )
              .join("")}

}

/* =========================================================
   💰 特别处理费用保存
========================================================= */

function saveExpenseModal(
  event
) {

  event.preventDefault();


  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const form =
    event.target;


  const data =
    new FormData(form);


  const values = {

    name:
      data.get("name") || "",

    amount:
      Number(
        data.get("amount")
      ) || 0,

    paidBy:
      data.get("paidBy") || "",

    itineraryId:
      data.get("itineraryId") || "",

    splitMembers:
      data.getAll(
        "splitMembers"
      ),

    note:
      data.get("note") || ""

  };


  if (
    !Array.isArray(
      trip.expense
    )
  ) {

    trip.expense = [];

  }


  if (
    editingId !== null
  ) {

    const expense =
      trip.expense.find(
        x =>
          String(x.id) ===
          String(editingId)
      );


    if (expense) {

      Object.assign(
        expense,
        values
      );

    }

  }

  else {

    trip.expense.push({

      id: createId(),

      ...values

    });

  }


  saveTrips();

  closeItemModal();

  render();

}


/* =========================================================
   💰 删除费用
========================================================= */

function deleteExpense(
  id
) {

  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const expense =
    trip.expense.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if (!expense) {
    return;
  }


  const ok =
    confirm(
      `确定要删除费用「${
        expense.name ||
        "未命名费用"
      }」吗？`
    );


  if (!ok) {
    return;
  }


  trip.expense =
    trip.expense.filter(
      x =>
        String(x.id) !==
        String(id)
    );


  saveTrips();

  render();

}


/* =========================================================
   💰 修正费用 Modal 的保存方式
========================================================= */

function saveItemModal(event) {

  /*
    💰 费用
  */

  if (
    editingType === "expense"
  ) {

    saveExpenseModal(event);

    return;

  }


  /*
    其他资料
    使用前面已经写好的保存逻辑
  */

  event.preventDefault();


  const trip =
    getCurrentTrip();

  if (!trip) {
    return;
  }


  const form =
    event.target;

  const data =
    new FormData(form);

  const values =
    Object.fromEntries(
      data.entries()
    );


  const type =
    editingType;

  const id =
    editingId;


  if (id !== null) {

    const item =
      trip[type]?.find(
        x =>
          String(x.id) ===
          String(id)
      );


    if (!item) {

      closeItemModal();

      return;

    }


    Object.assign(
      item,
      values
    );


    item.id = id;


    /*
      行程 → 来源
    */

    if (
      type === "itinerary"
    ) {

      syncItineraryToSource(
        item
      );

    }


    /*
      来源 → 行程
    */

    else {

      syncSourceToItinerary(
        type,
        item
      );

    }

  }


  else {

    const newItem = {

      id: createId(),

      ...values

    };


    if (
      !Array.isArray(
        trip[type]
      )
    ) {

      trip[type] = [];

    }


    trip[type].push(
      newItem
    );

  }


  saveTrips();

  closeItemModal();

  render();

}

/* =========================================================
   保存 Trip
========================================================= */

function saveTripModal(
  event,
  id
) {

  event.preventDefault();


  const form =
    event.target;


  const data =
    new FormData(form);


  const name =
    data.get("name") ||
    "未命名旅行";


  const startDate =
    data.get("startDate") ||
    "";


  const endDate =
    data.get("endDate") ||
    "";


  const members =
    data.getAll(
      "members"
    );


  if (id) {

    const trip =
      trips.find(
        x =>
          String(x.id) ===
          String(id)
      );


    if (trip) {

      trip.name =
        name;

      trip.startDate =
        startDate;

      trip.endDate =
        endDate;

      trip.members =
        members;

    }

  }

  else {

    const newTrip =
      createEmptyTrip(
        name,
        startDate,
        endDate
      );


    newTrip.members =
      members.length
        ? members
        : [...MEMBERS];


    trips.push(
      newTrip
    );


    currentTripId =
      newTrip.id;

    currentPage =
      "itinerary";

  }


  saveTrips();

  closeTripModal();

  render();

}

   关闭 Trip Modal
========================================================= */

  const modal =
    document.getElementById(
      "tripModal"

  if (modal) {

    modal.remove();

  }

}


/* =========================================================
   删除 Trip
========================================================= */

function deleteTrip(
  id
) {

  const trip =
    trips.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if (!trip) {
    return;
  }


  const ok =
    confirm(
      `确定要删除旅行「${
        trip.name ||
        "未命名旅行"
      }」吗？\n\n里面的行程、酒店、交通、景点、美食和费用都会一起删除。`
    );


  if (!ok) {
    return;
  }


  trips =
    trips.filter(
      x =>
        String(x.id) !==
        String(id)
    );


  if (
    String(currentTripId) ===
    String(id)
  ) {

    currentTripId =
      null;

    currentPage =
      "home";

  }


  saveTrips();

  render();

}

      <div class="detail-note">

        <div class="detail-note-title">

          📝 备注

        </div>


        <div class="detail-note-text">

          ${escapeHTML(
            item.note
          )}

        </div>

      </div>

    `;

  }


  html += `

      </div>

  `;


  return html;

}


/* =========================================================
   详情：图标
========================================================= */

function getTypeDetailIcon(
  type
) {

  const icons = {

    itinerary: "📅",

    hotel: "🏨",

    transport: "🚄",

    sight: "🏞️",

    shopping: "🛍️",

    food: "🍜",

    expense: "💰"

  };


  return icons[type] ||
    "📌";

}


/* =========================================================
   详情：资料行
========================================================= */

function detailRow(
  label,
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "";

  }


  return `

    <div class="detail-row">

      <div class="detail-label">

        ${escapeHTML(
          label
        )}

      </div>


      <div class="detail-value">

        ${escapeHTML(
          String(value)
        )}

      </div>

    </div>

  `;

}


/* =========================================================
   详情：链接
========================================================= */

function detailLink(
  link
) {

  if (!link) {
    return "";
  }


  let safeLink =
    String(link).trim();


  /*
    如果用户输入：
    www.xxx.com
    自动补 https://
  */

  if (
    !/^https?:\/\//i.test(
      safeLink
    )
  ) {

    safeLink =
      "https://" +
      safeLink;

  }


  return `

    <div class="detail-row">

      <div class="detail-label">

        🔗 链接

      </div>


      <div class="detail-value">

        <a
          class="detail-link"
          href="${escapeHTML(
            safeLink
          )}"
          target="_blank"
          rel="noopener noreferrer">

          打开链接 ↗

        </a>

      </div>

    </div>

  `;

}


/* =========================================================
   时间范围
========================================================= */

function formatTimeRange(
  start,
  end
) {

  if (
    start &&
    end
  ) {

    return `${start} ～ ${end}`;

  }


  return (
    start ||
    end ||
    ""
  );

}


/* =========================================================
   关闭详情
========================================================= */

function closeDetailModal() {

  const modal =
    document.getElementById(
      "detailModal"
    );


  if (modal) {

    modal.remove();

  }

}
